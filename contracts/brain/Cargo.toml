[package]
name = "chair-brain"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CHAIR brain: stakes the endowment in the NEAR AI farm and signs NEP-413 logins to NEAR AI Cloud through NEAR's MPC network"

[lib]
crate-type = ["cdylib", "rlib"]

# Own workspace: the brain and the mock farm used on testnet.
[workspace]
members = [".", "mock-farm"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
