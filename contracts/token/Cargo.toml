[package]
name = "chair-token"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CHAIR: a memecoin that runs its own central bank (NEP-141 token, bonding curve, constitution, rate meetings)"

[lib]
crate-type = ["cdylib", "rlib"]

# Own workspace: nothing else in the repo is a Cargo member.
[workspace]
members = ["."]

[dependencies]
near-sdk = { version = "=5.30.1", features = ["unstable"] }
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unstable", "unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"

# Optimised dependencies keep the mocked chain fast in unit tests.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
